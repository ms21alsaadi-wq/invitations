<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعواتي – صمّم دعوتك المتحركة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;700&family=El+Messiri:wght@400;700&family=Great+Vibes&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#FCFBF8;--sf:#fff;--tx:#1E2433;--mu:#6B7280;--ln:#EDE7D8;--pr:#8C6D22;--on:#fff;--gd:#B8902F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1413;--sf:#13201E;--tx:#EAF1EF;--mu:#9DB0AB;--ln:#243532;--pr:#D6B15E;--on:#0B1413;--gd:#D6B15E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1413;--sf:#13201E;--tx:#EAF1EF;--mu:#9DB0AB;--ln:#243532;--pr:#D6B15E;--on:#0B1413;--gd:#D6B15E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 Tajawal,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:28px;padding:12px 28px;flex-wrap:wrap}
.logo{font:700 30px Amiri,serif;color:var(--gd);line-height:1.4}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{font:500 15px Tajawal,sans-serif;background:none;border:0;color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{color:var(--gd);font-weight:700}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.sw:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:28px 16px 60px}
.hp{display:flex;gap:10px;align-items:center}
.hb{height:44px;min-width:44px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font:500 15px Tajawal,sans-serif;color:var(--tx)}
.av{width:32px;height:32px;border-radius:50%;background:#F3EBDD;color:var(--gd);display:grid;place-items:center}
.pill{font:500 16px Tajawal,sans-serif;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:999px;padding:16px 28px;box-shadow:0 6px 20px rgba(0,0,0,.06);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pill.big{width:100%;margin-top:26px}.pill [data-ic="spark"]{color:var(--gd)}
.pill:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.r2{display:flex;gap:14px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.htx{max-width:560px}
.showc{display:flex;align-items:center;justify-content:center}
.side{display:flex;flex-direction:column;justify-content:space-evenly;align-self:stretch}
.fi{width:54px;height:54px;border-radius:15px;background:linear-gradient(#F8F9FB,#F0F2F6);border:1px solid #E6E9EF;box-shadow:0 8px 22px rgba(30,36,51,.10);display:grid;place-items:center;color:#4B5563;position:relative;z-index:2}
.fi.gr{color:#43B85C}.fi.bl{color:#6B9BF2}.fi.wa{color:#43B85C;background:linear-gradient(#EEFAF0,#E2F5E6);border-color:#BFE6C8;box-shadow:0 8px 22px rgba(67,184,92,.22)}
.phone{position:relative;background:#0F1623;border-radius:40px;padding:6px;box-shadow:0 30px 60px rgba(30,36,51,.28);flex:none}
.phone .inv{width:300px;height:620px;zoom:.88;border-radius:34px;box-shadow:none;display:block}
@keyframes wave{0%,100%{transform:translateY(0)}25%{transform:translateY(-9px)}50%{transform:translateY(-14px)}75%{transform:translateY(-7px)}}
.fi{animation:wave 5.5s ease-in-out infinite}
.side:first-child .fi:nth-child(1){animation-delay:0s}.side:first-child .fi:nth-child(2){animation-delay:-.7s}.side:first-child .fi:nth-child(3){animation-delay:-1.4s}.side:first-child .fi:nth-child(4){animation-delay:-2.1s}
.side:last-child .fi:nth-child(1){animation-delay:-2.8s}.side:last-child .fi:nth-child(2){animation-delay:-3.5s}.side:last-child .fi:nth-child(3){animation-delay:-4.2s}.side:last-child .fi:nth-child(4){animation-delay:-4.9s}
@media (prefers-reduced-motion:reduce){.fi{animation:none}}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:74px;height:16px;background:#0F1623;border-radius:10px;z-index:3}
@media (max-width:960px){nav{order:3;flex:0 0 100%}.hp{margin-inline-start:auto}header{gap:8px;padding:10px 14px}.hero{min-height:0}}
@media (max-width:600px){.fi{width:40px;height:40px;border-radius:12px}.phone .inv{zoom:.6}.phone{border-radius:30px;padding:5px}.hb.hide{display:none}}
h1{font:800 clamp(38px,6vw,68px)/1.25 Tajawal,sans-serif;margin:0 0 14px;color:var(--tx)}
h2.t{font:700 30px Amiri,serif;margin:0 0 6px;color:var(--pr)}
.sub{color:var(--mu);margin:0 0 22px}
.btn{font:700 16px Tajawal,sans-serif;background:var(--pr);color:var(--on);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:none;color:var(--pr);border:1.5px solid var(--pr)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:calc(100vh - 150px)}
.hero p{font-size:19px;max-width:30em;color:var(--mu)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:50px;border-top:1px solid var(--ln);padding-top:26px}
.feat h3{margin:0 0 4px;font-size:18px;color:var(--pr)}.feat p{margin:0;color:var(--mu);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.card b{font-size:17px}.card small{color:var(--mu)}
.th{width:180px;height:320px;position:relative;overflow:hidden;border-radius:14px;direction:ltr;cursor:pointer}
.th .inv{transform:scale(.5);transform-origin:0 0;position:absolute;left:0;top:0;pointer-events:none;border-radius:0}
.studio{display:grid;grid-template-columns:1fr 380px;gap:30px;align-items:start}
.form{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:20px;display:grid;gap:14px}
.form label{display:grid;gap:4px;font-weight:500;font-size:15px}
.form input,.form select,.form textarea{font:400 16px Tajawal,sans-serif;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{border:2px solid transparent;border-radius:12px;padding:3px;background:none;cursor:pointer;font:500 13px Tajawal,sans-serif;color:var(--tx);display:grid;gap:3px;justify-items:center}
.sw i{width:56px;height:36px;border-radius:9px;display:block;border:1px solid var(--ln)}
.sw[aria-pressed="true"]{border-color:var(--gd)}
.note{color:var(--mu);font-size:14px;margin:0}
.v[hidden]{display:none}
.stp{display:flex;align-items:flex-start;margin:6px 0 24px}
.stp hr{flex:1;border:0;border-top:2px solid var(--ln);margin:19px 10px 0}
.sd{display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--mu)}
.sd b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sf);border:2px solid var(--ln);color:var(--mu)}
.sd.on b{border-color:var(--gd);box-shadow:0 0 0 5px rgba(184,144,47,.16);color:var(--tx)}.sd.on small{color:var(--tx);font-weight:700}
.sd.dn b{background:var(--gd);border-color:var(--gd);color:#fff}
.wz{display:grid;grid-template-columns:1fr 340px;gap:34px;align-items:start}
#wz{max-width:760px}
.prev{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px 20px;margin-bottom:18px;display:grid;gap:6px}
.prev .x{position:absolute;inset-inline-end:14px;top:8px;background:none;border:0;font-size:24px;color:var(--mu);cursor:pointer}
.qc{background:var(--sf);border:1px solid var(--ln);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.qh{position:relative;padding:22px 24px 18px;background:linear-gradient(90deg,color-mix(in srgb,var(--gd) 12%,var(--sf)),var(--sf));overflow:hidden}
.wm{position:absolute;inset-inline-end:14px;top:-6px;font:700 110px/1 Amiri,serif;color:var(--gd);opacity:.16}
.ql{font-weight:700;font-size:14px;color:var(--mu)}
.cnt{position:absolute;inset-inline-end:24px;top:20px;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px;z-index:1}
.qt{font-size:21px;line-height:1.5;margin:14px 0 0;position:relative;z-index:1}
.bar{height:3px;background:var(--ln)}.bar i{display:block;height:100%;background:#4B5160;transition:width .4s}
.qb{padding:22px 24px;min-height:200px}
.qb label{display:grid;gap:4px;font-weight:500;font-size:15px}
.qb input,.qb textarea{font:400 17px Tajawal,sans-serif;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);width:100%}
.fld{display:grid;gap:12px;justify-items:start}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.op{font:500 15px Tajawal,sans-serif;background:var(--sf);color:var(--tx);border:2px solid var(--ln);border-radius:16px;padding:16px 8px;cursor:pointer;display:grid;gap:8px;justify-items:center;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.op[aria-pressed="true"]{border-color:var(--gd);background:color-mix(in srgb,var(--gd) 10%,var(--sf))}
.op i{width:56px;height:36px;border-radius:9px;border:1px solid var(--ln)}
.opts.ev2{grid-template-columns:repeat(2,1fr)}
.op.ev{justify-items:start;align-content:center;text-align:start;padding:22px 26px;border-radius:20px;color:var(--mu);font-size:19px;gap:10px}
.op.ev small{font-size:14px;opacity:.7}
.op.ev[aria-pressed="true"]{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx);background:color-mix(in srgb,var(--tx) 4%,var(--sf));color:var(--tx)}
.qf{display:flex;justify-content:space-between;padding:12px 24px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu)}
.nb{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:12px 16px;margin-top:16px}
.nb .mid{flex:1;display:grid;gap:6px;justify-items:center;font-size:14px}
.dots{display:flex;gap:4px}.dots u{width:6px;height:6px;border-radius:3px;background:var(--ln);display:block}.dots u.on{width:22px;background:#4B5160}
.nx,.bk{font:700 16px Tajawal,sans-serif;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;background:var(--sf);color:var(--tx);box-shadow:0 5px 16px rgba(0,0,0,.1);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.bk{background:none;box-shadow:none;color:var(--mu)}.bk:disabled{opacity:.4;cursor:default}
.nx.dk,.dk{background:#4B5160;color:#fff}
.op:focus-visible,.nx:focus-visible,.bk:focus-visible,.x:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.cust{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--bg);border:2px dashed var(--ln);border-radius:20px;padding:16px;cursor:pointer;color:var(--tx);font:inherit;margin-bottom:16px}
.cust span:nth-child(2){flex:1;display:grid}.cust small,.rw small{color:var(--mu);font-size:14px}
.ci{width:54px;height:54px;border-radius:14px;background:#1F2330;color:#F2D58A;display:grid;place-items:center}
.priv{background:color-mix(in srgb,#8B5CF6 8%,var(--sf));border:1px solid color-mix(in srgb,#8B5CF6 28%,var(--ln));border-radius:20px;padding:14px;margin-bottom:16px;display:grid;gap:10px}
.ph{display:flex;justify-content:space-between;color:#7C3AED;font-weight:700}.ph em{font-style:normal;background:color-mix(in srgb,#8B5CF6 16%,var(--sf));border-radius:999px;padding:0 12px}
.cr{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px}
.pl{border:1px solid var(--ln);border-radius:999px;padding:6px 16px;background:var(--bg);font-size:15px}
.lk{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;justify-self:start}
.sc{display:grid;place-items:center;width:100%;height:36px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--mu);cursor:pointer;margin:6px 0}
.lst{display:grid;gap:10px;max-height:300px;overflow:auto;padding:2px}.lst.full{max-height:none}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:start;background:var(--sf);border:2px solid var(--ln);border-radius:18px;padding:12px 18px;cursor:pointer;color:var(--tx);font:inherit}
.rw span{display:grid}.rw b{font-size:19px}
.rw[aria-pressed="true"]{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx)}
.tn{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:30px;font-style:normal;border:1px solid var(--ln);flex:none}
.cust:focus-visible,.rw:focus-visible,.sc:focus-visible,.lk:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.inv .pgs{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.inv .pgs::-webkit-scrollbar{display:none}
.inv .pg{flex:0 0 100%;position:relative;background-size:cover;background-position:center}
.inv .pg:not(.vis) .in>*{animation-play-state:paused}
.inv.cu canvas{z-index:2;pointer-events:none}
.inv .in{padding-bottom:116px}.inv .in .rs{display:none}
.inv .dg{position:absolute;top:50%;right:10px;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;gap:5px}
.inv .dg u{width:6px;height:6px;border-radius:3px;background:var(--ac);opacity:.4;transition:height .3s}.inv .dg u.on{opacity:1;height:18px}
.inv .tb{position:absolute;inset:auto 12px 12px;z-index:4;display:flex;align-items:flex-end;justify-content:space-between;background:color-mix(in srgb,var(--b1) 82%,#fff);border:1.5px solid color-mix(in srgb,var(--ink) 55%,transparent);backdrop-filter:blur(8px);border-radius:20px;padding:8px 6px 6px}
.inv .tb .ti{flex:1 1 0;min-width:0;background:none;border:0;display:grid;justify-items:center;gap:3px;color:var(--ti);text-decoration:none;cursor:pointer;font:inherit}
.inv .tb .ti i{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--ink) 14%,transparent);display:grid;place-items:center}
.inv .tb .ti small{color:var(--tt);font-size:10px;line-height:1.15;text-align:center;min-height:2.3em;display:block}
.inv .tb .off{opacity:.45;cursor:pointer}
.inv .tst{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(8px);background:rgba(0,0,0,.82);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9;white-space:nowrap}.inv .tst.on{opacity:1;transform:translateX(-50%)}.inv .tb .on i{background:var(--ac);color:var(--b1)}
.inv .tb .cam{flex:none;width:68px;height:68px;margin:-26px 4px 0;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:radial-gradient(circle at 35% 30%,#F2DC9B,#C9A24B 70%);box-shadow:0 0 18px rgba(214,177,94,.55);display:grid;place-items:center;color:#fff;cursor:pointer}
.inv .gal{position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.88);color:#fff;display:grid;align-content:center;justify-items:center;gap:12px;padding:30px;text-align:center}
.inv .gal[hidden]{display:none}
.inv .gal .gg{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:480px;overflow:auto}.inv .gal img{width:100%;border-radius:10px;object-fit:cover;aspect-ratio:9/16}
.inv .gx{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer}
.inv .fl{position:absolute;width:170px;height:170px;color:var(--ac);opacity:.18;pointer-events:none}.inv .fl svg{width:100%;height:100%}
.inv .fl.a{top:-8px;left:-8px}.inv .fl.b{bottom:70px;right:-10px;transform:rotate(180deg)}
.inv .sl{position:absolute;inset:0;z-index:6;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-content:center;justify-items:center;gap:10px;cursor:pointer;transition:opacity .6s;font:inherit}
.inv .sl.go{opacity:0;pointer-events:none}.inv .sl img{width:120px;height:120px;border-radius:50%;object-fit:cover}.inv.still .sl{display:none}
.cvh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nt{background:color-mix(in srgb,var(--gd) 12%,var(--sf));border:1px solid color-mix(in srgb,var(--gd) 40%,var(--ln));border-radius:16px;padding:12px 16px;font-size:15px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{font:500 14px Tajawal,sans-serif;border:0;border-radius:12px;padding:12px 18px;background:var(--bg);color:var(--mu);cursor:pointer}
.tabs button[aria-pressed="true"]{background:#C4A55A;color:#fff;font-weight:700}
.bx{border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:14px;display:grid;gap:10px}
.bt{font-weight:700;font-size:14px;color:var(--mu)}.bh{font-weight:700}
.up{display:grid;place-content:center;justify-items:center;gap:6px;height:112px;border:2px dashed #D9C28B;border-radius:16px;background:transparent center/cover;color:#A07F2B;cursor:pointer;font:inherit;font-size:14px}
.up.has{color:#fff;text-shadow:0 1px 4px #000}
.hint{margin:0;font-size:12.5px;color:var(--mu)}
.cl{display:grid;gap:6px}.cl b{font-size:14px}.cl b span{color:var(--mu);margin-inline-end:6px}
.cr2{display:flex;align-items:center;gap:10px}
.cr2 input[type=color]{width:46px;height:46px;border:1px solid var(--ln);border-radius:12px;padding:3px;background:var(--sf);cursor:pointer;flex:none}
.cr2 input[type=text]{font:500 15px ui-monospace,monospace;text-align:left;flex:1}
.xx{background:none;border:0;font-size:20px;color:var(--mu);cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.strip button{aspect-ratio:9/16;border:2px solid var(--ln);border-radius:14px;background:var(--bg) center/cover;color:var(--mu);display:grid;place-content:center;justify-items:center;gap:4px;cursor:pointer;font:inherit}
.strip small{font-size:11px}.strip button[aria-pressed="true"]{border-color:var(--tx)}
.up:focus-visible,.tabs button:focus-visible,.strip button:focus-visible,.xx:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.hintb{border:1.5px dashed var(--ln);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--mu);margin-bottom:14px}
.qb .lb{font-weight:500;font-size:14px;color:var(--mu);margin:16px 0 6px}
.qb label{margin-top:14px}.qb .two label{margin-top:0}
.qb select{font:400 16px Tajawal,sans-serif;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);width:100%}
.pvb{margin-top:12px;background:color-mix(in srgb,var(--gd) 8%,var(--sf));border:1px solid var(--ln);border-radius:16px;padding:22px;text-align:center;font-size:22px;color:var(--mu)}
.pvb.g{color:#B8902F;font-size:34px;padding:26px}
.imgc{display:grid;gap:10px;border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-top:14px}
.imgc .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw2{width:48px;height:28px;border-radius:14px;background:var(--ln);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
