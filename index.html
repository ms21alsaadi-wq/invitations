.inv .sl.go{opacity:0;pointer-events:none}.inv .sl img{width:120px;height:120px;border-radius:50%;object-fit:cover}.inv.still .sl{display:none}


/* calendar card + glass message */
.inv .calc{width:min(250px,100%);margin:0 auto;border-radius:20px;overflow:hidden;text-align:center;background:color-mix(in srgb,var(--ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:0 0 16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.inv .calc .cm{background:var(--ac);color:var(--b1);font-weight:700;padding:9px 6px;font-size:15px;letter-spacing:.04em}
.inv .calc .cdn{font-size:64px;line-height:1.15;font-weight:700;margin-top:8px}
.inv .calc .cwd{font-size:19px}.inv .calc .cti{color:var(--ac);font-size:17px;margin:2px 0 8px}
.inv .calc .chj{display:block;opacity:.7;font-size:12px;margin-bottom:8px}
.inv .calc .svd{font:inherit;font-size:14px;cursor:pointer;color:var(--b1);background:var(--ac);border:0;border-radius:999px;padding:8px 18px;margin-top:4px}
.inv .ms:not(:empty){background:color-mix(in srgb,var(--ink) 7%,transparent);border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:20px;padding:16px 18px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.inv .pinart{display:block;width:84px;margin:12px auto -6px}.inv .pinart img{width:100%;display:block;filter:drop-shadow(0 6px 8px rgba(110,60,40,.25))}
.inv .pre{white-space:pre-line}
.inv .mono{font-size:52px;line-height:1.1;color:var(--ac);margin:4px 0 0;letter-spacing:.04em}.inv .mono i{font-style:normal;font-size:.5em;margin:0 .3em;opacity:.8;vertical-align:middle}
.inv .himg{max-width:150px;max-height:120px;object-fit:contain;display:block;margin:0 auto}
.inv .sl.env .vecd .vmono{font-size:34px;color:#8B1E2B}.inv .sl.env .vecd .vmono i{font-size:.5em;margin:0 .3em}
.inv.bgt .prg,.inv.bgt .ms:not(:empty),.inv.bgt .calc{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.inv.bgt .calc.s1 .cm{display:inline-block;border-radius:999px;padding:7px 22px}.inv.bgt .calc.s1{overflow:visible}
.inv.bgt .calc.s4 .cl2{background:none}
/* program custom icons */
.pr .prx{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.pr .pim{width:40px;height:40px;border-radius:10px;border:1.5px dashed var(--ln);background:var(--bg);cursor:pointer;display:grid;place-items:center;padding:3px;font-size:16px;color:var(--mu)}
.pr .pim.has{border-style:solid}.pr .pim img{max-width:100%;max-height:100%;object-fit:contain}
.pr .psz{display:flex!important;align-items:center;gap:6px;margin:0 auto 0 0!important;font-size:13px;font-weight:400}.pr .psz select{width:78px!important;padding:6px 8px!important}
.inv .prg li{grid-template-columns:1fr minmax(46px,auto) 1fr;column-gap:8px}
.inv .prg li i:not(:empty){width:var(--isz,40px);height:var(--isz,40px);font-size:calc(var(--isz,40px)*.5)}
.inv .prg li i.im{background:none;border-radius:0}.inv .prg li i.im img{width:100%;height:100%;object-fit:contain;display:block}
/* fixed-background template */
.inv.bgt .pg.sec{min-height:506px;background-size:100% 100%}
.inv.bgt .pg.first{background-size:cover;background-position:center bottom}
.inv.bgt .pg.last{min-height:506px}
.inv.bgt .pg.first .in{justify-content:flex-start;padding-top:34px}.inv.bgt .pg.first .ms:not(:empty){background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
.inv.bgt .pgs .pg.sec[data-bg="1"] .in{padding-top:112px}
.inv .calc{--cc:var(--ac)}.inv .calc .cl1,.inv .calc .cl2{display:contents}
.inv .calc .cm{background:var(--cc)}.inv .calc .cti{color:var(--cc)}.inv .calc .svd{background:var(--cc)}
.inv .calc.s2{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;width:min(280px,100%);padding:0 0 6px;border-radius:0}
.inv .calc.s2 .cm{background:none;color:var(--cc);display:flex;align-items:center;gap:10px;justify-content:center;font-size:16px;padding:0}
.inv .calc.s2 .cm::before,.inv .calc.s2 .cm::after{content:"";height:1px;flex:1;background:var(--cc);opacity:.7}
.inv .calc.s2 .cdn{font-size:86px;line-height:1;color:var(--cc);margin:6px 0 2px;font-weight:300}
.inv .calc.s3{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;display:grid;justify-items:center;width:100%}
.inv .calc.s3 .cl1{display:grid;width:200px;height:200px;border:3px solid var(--cc);border-radius:50%;align-content:center;justify-items:center;box-shadow:0 0 0 7px color-mix(in srgb,var(--cc) 18%,transparent)}
.inv .calc.s3 .cm{background:none;color:var(--cc);padding:0;font-size:14px}.inv .calc.s3 .cdn{font-size:66px;line-height:1.1;margin:0}
.inv .calc.s3 .cwd{margin-top:14px}
.inv .calc.s4{display:grid;grid-template-columns:auto 1fr;text-align:right;padding:0;width:min(290px,100%);align-items:stretch}
.inv .calc.s4 .cl1{display:grid;align-content:center;justify-items:center;background:var(--cc);color:#fff;padding:14px 18px;grid-row:1}
.inv .calc.s4 .cm{background:none;color:#fff;padding:0;font-size:13px;order:-1}.inv .calc.s4 .cdn{font-size:50px;margin:0;line-height:1.1}
.inv .calc.s4 .cl2{display:grid;align-content:center;padding:0 16px;grid-row:1}
.inv .calc.s4 .cwd{font-size:18px}.inv .calc.s4 .cti{margin:2px 0 0}
.inv .calc.s4 .svd{grid-column:1/-1;border-radius:0;margin:0;padding:10px}
.inv .calc.s4 .chj{grid-column:1/-1}

{t:'الدعوة',q:'الآن نكتب نص الدعوة 💌',b:()=>{const d=S.d;

{t:'الموقع',q:'أين سيقام الاحتفال؟ 📍',b:()=>{const d=S.d;if(!d.vs)d.vs=[{n:d.venue||'',a:'',m:d.map||''}];

{t:'برنامج الحفل',q:'هل تريد مشاركة برنامج الحفل مع ضيوفك؟ 🎭',b:()=>{const d=S.d;if(!d.prog)d.prog=[];

{t:'تفاصيل الحدث',q:'هل هناك قواعد أو ملاحظات خاصة؟ 📋',b:()=>{const d=S.d,A=d.rules||[],cu=A.filter(x=>!RULES.includes(x));

<div class="ab"><a class="nx" target="_blank" rel="noopener" href="${esc(l)}">فتح</a><button class="nx" data-m="cp" data-l="${esc(l)}">نسخ الرابط</button><a class="nx" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(l)}">إرسال الرابط بالواتساب</a><button class="nx" data-m="rs" aria-pressed="false">ردود الضيوف (${rs.length})</button>${i.qe==='true'?`<button class="nx" data-m="sc" aria-pressed="false">ماسح الدخول</button>`:''}<button class="nx" data-m="gl" aria-pressed="false">قائمة المدعوين (${(GL[i.id]||[]).length})</button><button class="nx" data-m="ph" aria-pressed="false">صور الضيوف (${(PH[i.id]||[]).length})</button><button class="nx" data-m="rop">${i.rsvp_open===false?'فتح استقبال الردود':'إيقاف استقبال الردود'}</button><button class="nx" data-m="ed">تعديل</button><button class="nx" data-m="rm">حذف</button></div>
<div class="rl" hidden><b>ردود الضيوف</b>${rs.length?rs.map(r=>`<div class="rr"><b>${esc(r.name)}</b><span class="${r.status==='yes'?'y':'n'}">${r.status==='yes'?'سيحضر ('+r.guests+')':'معتذر'}</span><button class="dl" data-m="drs" data-id="${r.id}" aria-label="حذف الرد">✕</button>${r.note?`<small>${esc(r.note)}</small>`:''}<small>${fmt(r.created_at)}</small></div>`).join(''):'<p class="note">لا توجد ردود بعد.</p>'}</div><div class="pl" hidden></div><div class="gl" hidden>${glHtml(i)}</div>${i.qe==='true'?`<div class="sp" hidden><b>رابط الماسح</b><p class="note">أرسله لموظفي الاستقبال، يفتح الكاميرا ويتحقق من رمز كل ضيف بدون حساب. لا تشاركه مع الضيوف.</p><input readonly dir="ltr" value="${esc(scanUrl(i))}" aria-label="رابط الماسح" onfocus="this.select()"><div class="ab"><button class="nx" data-m="cp" data-l="${esc(scanUrl(i))}">نسخ الرابط</button><a class="nx" target="_blank" rel="noopener" href="${esc(scanUrl(i))}">فتح الماسح</a><a class="nx" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('رابط ماسح الدخول: '+scanUrl(i))}">إرسال بالواتساب</a></div></div>`:''}</article>`}).join('');
  el.querySelectorAll('.ic2').forEach(c=>{const w=was[c.dataset.id];if(!w)return;[['.rl','rs'],['.pl','ph'],['.sp','sc'],['.gl','gl']].forEach(([q,m],k)=>{if(!w[k])return;const e=c.querySelector(q);if(!e)return;e.hidden=false;const bt=c.querySelector('[data-m="'+m+'"]');if(bt)bt.setAttribute('aria-pressed','true');if(m==='ph')loadPhotos(c,c.dataset.id)})});
}
$('#my').addEventListener('click',async e=>{
  const b=e.target.closest('[data-m],[data-a]');if(!b)return;
  if(b.dataset.a==='mynew'){S={t:0,d:sample(T[0])};W={g:0,s:0};cv=false;dismissed=true;go('studio');return}
  if(b.dataset.a==='myout'){if(sb)await sb.auth.signOut();go('home');return}
  const card=b.closest('.ic2'),id=card&&card.dataset.id,m=b.dataset.m;
  if(m==='cp'){try{await navigator.clipboard.writeText(b.dataset.l);b.textContent='تم النسخ ✓'}catch(_){b.textContent='انسخ يدوياً'}}
  else if(m==='rs'){const r=card.querySelector('.rl');r.hidden=!r.hidden;b.setAttribute('aria-pressed',String(!r.hidden))}
  else if(m==='sc'){const p=card.querySelector('.sp');p.hidden=!p.hidden;b.setAttribute('aria-pressed',String(!p.hidden))}
  else if(m==='ph'){const p=card.querySelector('.pl');p.hidden=!p.hidden;b.setAttribute('aria-pressed',String(!p.hidden));if(!p.hidden)loadPhotos(card,id)}
  else if(m==='gl'){const p=card.querySelector('.gl');p.hidden=!p.hidden;b.setAttribute('aria-pressed',String(!p.hidden))}
  else if(m==='gadd'||m==='gbulk'){
    const slug=card.dataset.slug,rows=[];
    if(m==='gadd'){const n=card.querySelector('.gn').value.trim(),c=Math.min(50,Math.max(1,+card.querySelector('.gc').value||1)),p=card.querySelector('.gp').value.trim();if(!n){alert('اكتب اسم الضيف.');return}rows.push({invitation_id:id,name:n.slice(0,100),invited:c,phone:p.slice(0,30)||null,source:'list'})}
    else{String(card.querySelector('.gb').value||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).split(/\r?\n/).forEach(ln=>{const parts=ln.split(/[\t,،;؛]+/).map(x=>x.trim()).filter(Boolean);if(!parts.length)return;let n='',c=1,p='';parts.forEach(x=>{const d=x.replace(/[\s+\-()]/g,'');if(/^\d+$/.test(d)){if(d.length<=3)c=Math.min(50,Math.max(1,+d));else p=x}else if(!n)n=x});if(n)rows.push({invitation_id:id,name:n.slice(0,100),invited:c,phone:p.slice(0,30)||null,source:'list'})});
      if(!rows.length){alert('اكتب اسماً واحداً على الأقل.');return}}
    b.disabled=true;const r=await sb.from('tickets').insert(rows);b.disabled=false;
    if(r.error){alert(/list_full/.test(r.error.message||'')?'وصلت للحد الأقصى (1000 ضيف) لهذه الدعوة.':'تعذّرت الإضافة.');return}renderMy()}
  else if(m==='gwa'||m==='gcp'||m==='ged'||m==='gdl'||m==='gsent'){
    const g=(GL[id]||[]).find(x=>x.id===b.dataset.id);if(!g)return;const slug=card.dataset.slug;
    if(m==='gsent'){await gMark(card,id,g,!g.sent_at);return}
    if(m==='gwa'){gSend(card,slug,g);gMark(card,id,g,true);return}
    else if(m==='gcp'){try{await navigator.clipboard.writeText(gUrl(slug,g.token));b.textContent='تم النسخ ✓'}catch(_){b.textContent='انسخ يدوياً'}}
    else if(m==='ged'){const n=prompt('اسم الضيف',g.name);if(n===null||!n.trim())return;const c=prompt('عدد الأشخاص',String(g.invited||g.guests));if(c===null)return;const r=await sb.from('tickets').update({name:n.trim().slice(0,100),invited:Math.min(50,Math.max(1,+c||1))}).eq('id',g.id);if(r.error)alert('تعذّر التعديل.');else renderMy()}
    else{if(!confirm('حذف «'+g.name+'» من القائمة؟ سيتوقف رابطه وباركوده.'))return;const r=await sb.from('tickets').delete().eq('id',g.id);if(r.error)alert('تعذّر الحذف.');else renderMy()}}
  else if(m==='gnext'){const L=GL[id]||[],g=L.find(x=>!x.sent_at&&x.status!=='no'&&!x.checked_at);if(!g)return;gSend(card,card.dataset.slug,g);gMark(card,id,g,true)}
  else if(m==='grst'){if(!confirm('مسح علامة «تم الإرسال» عن كل الضيوف؟'))return;const r=await sb.from('tickets').update({sent_at:null}).eq('invitation_id',id).eq('source','list');if(r.error)alert('تعذّر التعديل.');else renderMy()}
  else if(m==='gall'||m==='gcsv'){
    const slug=card.dataset.slug,L=GL[id]||[];
    if(m==='gall'){try{await navigator.clipboard.writeText(L.map(g=>g.name+'\t'+gUrl(slug,g.token)).join('\n'));b.textContent='تم النسخ ✓'}catch(_){b.textContent='انسخ يدوياً'}}
    else{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=[['الاسم','العدد','الجوال','الرابط','الحالة','دخل']].concat(L.map(g=>[g.name,g.invited||g.guests,g.phone||'',gUrl(slug,g.token),g.status==='yes'?'أكد':g.status==='no'?'اعتذر':'',g.checked_at?'نعم':'']));
      const bl=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='guests.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}}
  else if(m==='drs'){if(!confirm('حذف هذا الرد نهائياً؟'))return;const r=await sb.from('rsvps').delete().eq('id',b.dataset.id);if(r.error)alert('تعذّر الحذف.');else renderMy()}
  else if(m==='dph'){if(!confirm('حذف هذه الصورة نهائياً؟'))return;try{await sb.storage.from('guest-photos').remove([b.dataset.p])}catch(_){}const r=await sb.from('photos').delete().eq('id',b.dataset.id);if(r.error)alert('تعذّر الحذف.');else renderMy()}
  else if(m==='rop'){const on=card.dataset.open==='1';b.disabled=true;const r=await sb.from('invitations').update({rsvp_open:!on}).eq('id',id);b.disabled=false;if(r.error)alert('تعذّر التعديل.');else renderMy()}
  else if(m==='ed'){b.disabled=true;const r=await sb.from('invitations').select('id,slug,data').eq('id',id).single();b.disabled=false;
    if(r.error||!r.data||!r.data.data||!r.data.data.d){alert('تعذّر فتح الدعوة للتعديل.');return}
    S={t:r.data.data.t,d:r.data.data.d,id:r.data.id,slug:r.data.slug};W={g:1,s:0};cv=S.t==='c';dismissed=true;go('studio')}
  else if(m==='rm'){if(!confirm('حذف هذه الدعوة وكل ردودها نهائياً؟'))return;const r=await sb.from('invitations').delete().eq('id',id);if(r.error)alert('تعذّر الحذف.');else renderMy()}
});
if(SCANSLUG)bootScan();else if(PASSTOK)bootPass();else if(PUBSLUG)bootPublic();else go('home');

</script>
</body>
</html>
